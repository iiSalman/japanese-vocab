<style>
:root { --bg: #0b0f14; --fg: #e7eaf0; --muted: #93a0b2; --card: #131922; --accent: #60a5fa; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px;
  font-family: "Noto Sans JP", "Hiragino Kaku Gothic Pro", "Yu Gothic", "MS Gothic", sans-serif;
  background: var(--bg); color: var(--fg); line-height: 1.5;
}
h1 { font-size: 1.6rem; margin: 0 0 8px; }
.subtitle { color: var(--muted); margin-bottom: 24px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card {
  background: var(--card); border-radius: 14px; padding: 18px;
  display: flex; flex-direction: column; gap: 10px;
}
.card-head { display: flex; gap: 6px; align-items: center; }
.card-head .pill { font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; color: #0b0f14; font-weight: 600; }
.card-head .pill.type { background: #475569; color: #e7eaf0; }
.card-head .tts {
  margin-left: auto; background: transparent; border: 1px solid #334155;
  color: var(--fg); padding: 2px 8px; border-radius: 8px; cursor: pointer;
}
.kanji { font-size: 2rem; font-weight: 600; letter-spacing: 1px; }
.kanji ruby rt { font-size: 0.45em; opacity: 0.75; font-weight: 400; }
.meaning { font-size: 1rem; font-weight: 600; }
.illustration img { width: 100%; border-radius: 10px; }
.scene { font-size: 0.9rem; color: var(--fg); }
.scene-en { font-size: 0.85rem; color: var(--muted); font-style: italic; margin-top: 4px; }
.why { font-size: 0.8rem; color: var(--muted); }
nav.crumbs { margin-bottom: 16px; font-size: 0.85rem; }
nav.crumbs a { color: var(--accent); text-decoration: none; }
nav.crumbs a:hover { text-decoration: underline; }
</style>
</head>
